scalar DateTime

# ─── Types ───────────────────────────────────────────────────────────────────

type Folder {
  id: ID!
  name: String!
  createdAt: DateTime!
  bookmarks: [Bookmark!]!
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  tags: [String!]!
  folderId: ID!
  createdAt: DateTime!
}

# ─── Pagination ───────────────────────────────────────────────────────────────

type BookmarkPage {
  items: [Bookmark!]!
  nextCursor: String
}

# ─── Query ───────────────────────────────────────────────────────────────────

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder

  bookmarks(
    folderId: ID
    search: String
    take: Int
    cursor: String
  ): BookmarkPage!
}

# ─── Inputs ──────────────────────────────────────────────────────────────────

input CreateFolderInput {
  name: String!
}

input CreateBookmarkInput {
  title: String!
  url: String!
  tags: [String!]
  folderId: ID!
}

input UpdateBookmarkInput {
  title: String
  url: String
  tags: [String!]
}

# ─── Mutation ────────────────────────────────────────────────────────────────

type Mutation {
  createFolder(input: CreateFolderInput!): Folder!
  createBookmark(input: CreateBookmarkInput!): Bookmark!
  updateBookmark(id: ID!, input: UpdateBookmarkInput!): Bookmark!
  deleteBookmark(id: ID!): Boolean!
  moveBookmark(id: ID!, folderId: ID!): Bookmark!
}
